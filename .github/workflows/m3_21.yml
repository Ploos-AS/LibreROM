name: M3.21 Interior Handle reuse

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf
      - name: Qualify M3.21 interior Handle reuse
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m3_21.sh
      - name: Upload M3.21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-m3.21-evidence
          path: |
            build/librom-m3.21-macplus.bin
            build/librom-m3.21-macplus.map
            build/m3_21-runtime/runtime.txt
          if-no-files-found: warn
