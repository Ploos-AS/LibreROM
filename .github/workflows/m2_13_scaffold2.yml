name: Run M2.13 scaffold helper

on:
  push:
    paths:
      - '.github/workflows/m2_13_scaffold2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scaffold and commit M2.13
        run: |
          python3 tools/scaffold_m2_13.py
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/macplus/reset_m2_13.S linker/m2_13.ld scripts/check_m2_13.py scripts/qualify_m2_13.sh scripts/qualify_m2_13_pce.sh docs/M2_13_BOOT_TRANSFER_QUALIFICATION.md Makefile
          git commit -m "M2.13: add loaded boot control transfer"
          git push origin HEAD:main
