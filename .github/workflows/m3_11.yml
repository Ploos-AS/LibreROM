name: M3.11 purge reclaim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m3_11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3
      - name: Qualify M3.11 purge reclaim
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m3_11.sh
      - name: Upload M3.11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-m3_11-evidence
          path: |
            build/librom-m3.11-macplus.bin
            build/librom-m3.11-macplus.map
            build/m3_11-runtime/runtime.txt
          if-no-files-found: warn
