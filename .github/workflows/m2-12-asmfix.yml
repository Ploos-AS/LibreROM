name: M2.12 asmfix

on:
  push:
    paths:
      - .github/workflows/m2-12-asmfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix M2.12 address checksum assembly
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/platform/macplus/reset_m2_12.S'); s=p.read_text(); old='        moveq   #0,%d7\\n        move.b  0(%a0),%d7\\n        eor.b   1(%a0),%d7\\n        eor.b   2(%a0),%d7\\n        eor.b   3(%a0),%d7\\n        eor.b   4(%a0),%d7\\n'; new='        moveq   #0,%d7\\n        move.b  0(%a0),%d7\\n        moveq   #0,%d0\\n        move.b  1(%a0),%d0\\n        eor.b   %d0,%d7\\n        moveq   #0,%d0\\n        move.b  2(%a0),%d0\\n        eor.b   %d0,%d7\\n        moveq   #0,%d0\\n        move.b  3(%a0),%d0\\n        eor.b   %d0,%d7\\n        moveq   #0,%d0\\n        move.b  4(%a0),%d0\\n        eor.b   %d0,%d7\\n'; assert old in s, 'expected checksum block not found'; p.write_text(s.replace(old,new,1))"
          git config user.name 'Ploos-AS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/platform/macplus/reset_m2_12.S
          git commit -m 'M2.12: fix address checksum assembly'
          git push origin HEAD:main
