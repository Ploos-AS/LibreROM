name: CI

on:
  push:
  pull_request:

jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3

      - name: Static checks
        run: make check

      - name: Build and qualify M1
        run: make CROSS=m68k-linux-gnu- qualify-m1

      - name: Upload M1 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-m1-evidence
          path: |
            build/librom-m1.bin
            build/librom-m1.map
            build/m1-runtime/runtime.txt
          if-no-files-found: warn
