name: M3.22 Interior hole splitting

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf
      - name: Qualify M3.22 interior hole splitting
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m3_22.sh
      - name: Upload M3.22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-m3.22-evidence
          path: |
            build/librom-m3.22-macplus.bin
            build/librom-m3.22-macplus.map
            build/m3_22-runtime/runtime.txt
          if-no-files-found: warn
