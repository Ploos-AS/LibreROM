name: M2.12 fast GCR hotfix

on:
  push:
    paths:
      - '.github/workflows/m2_12_fastgcr_hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch M2.12 GCR decoder
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/macplus/reset_m2_12.S
          git commit -m "M2.12: use timing-safe GCR decode lookup"
          git push origin HEAD:main
