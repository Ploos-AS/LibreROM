name: M3.19 Mixed tail coalescing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf
      - name: Qualify M3.19 mixed Ptr/Handle tail coalescing
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m3_19.sh
      - name: Upload M3.19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-m3.19-evidence
          path: |
            build/librom-m3.19-macplus.bin
            build/librom-m3.19-macplus.map
            build/m3_19-runtime/runtime.txt
          if-no-files-found: warn
