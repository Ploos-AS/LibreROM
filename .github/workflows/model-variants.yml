name: Model variants

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macplus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf

      - name: Check model profiles
        run: python3 scripts/check_model_variants.py

      - name: Qualify current Macintosh Plus source milestone
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m3_16.sh

      - name: Package persistent Macintosh Plus variant
        run: python3 scripts/package_model_variant.py profiles/macplus.json

      - name: Verify packaged variant
        run: |
          test -s build/variants/macplus/librerom-macplus.bin
          test "$(stat -c %s build/variants/macplus/librerom-macplus.bin)" -eq 131072
          test -s build/variants/macplus/librerom-macplus.map
          test -s build/variants/macplus/manifest.json
          grep -q '"model_id": "macplus"' build/variants/macplus/manifest.json
          grep -q '"source_milestone": "m3.16"' build/variants/macplus/manifest.json

      - name: Upload Macintosh Plus LibreROM variant
        uses: actions/upload-artifact@v4
        with:
          name: librerom-macplus
          path: |
            build/variants/macplus/librerom-macplus.bin
            build/variants/macplus/librerom-macplus.map
            build/variants/macplus/manifest.json
          if-no-files-found: error
