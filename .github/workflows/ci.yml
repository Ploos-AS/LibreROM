name: CI

on:
  push:
  pull_request:

jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf

      - name: Static checks
        run: make check

      - name: Build and qualify M1
        run: make CROSS=m68k-linux-gnu- qualify-m1

      - name: Build and qualify M2.3 Mac Plus path
        run: make CROSS=m68k-linux-gnu- qualify-m2_3

      - name: Build and qualify M2.4 RAM/vector path
        run: make CROSS=m68k-linux-gnu- qualify-m2_4

      - name: Qualify M2.5 in independent PCE Mac Plus model
        run: make CROSS=m68k-linux-gnu- qualify-m2_5

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-runtime-evidence
          path: |
            build/librom-m1.bin
            build/librom-m1.map
            build/m1-runtime/runtime.txt
            build/librom-m2.3-macplus.bin
            build/librom-m2.3-macplus.map
            build/m2_3-runtime/runtime.txt
            build/librom-m2.4-macplus.bin
            build/librom-m2.4-macplus.map
            build/m2_4-runtime/runtime.txt
            build/m2_5-pce/libre-rom-mac-plus.cfg
            build/m2_5-pce/runtime.txt
          if-no-files-found: warn
