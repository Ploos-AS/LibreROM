name: CI

on:
  push:
  pull_request:

jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf

      - name: Static checks
        run: make check

      - name: Build and qualify M1
        run: make CROSS=m68k-linux-gnu- qualify-m1

      - name: Build and qualify M2.3 Mac Plus path
        run: make CROSS=m68k-linux-gnu- qualify-m2_3

      - name: Build and qualify M2.4 RAM/vector path
        run: make CROSS=m68k-linux-gnu- qualify-m2_4

      - name: Qualify M2.5 in independent PCE Mac Plus model
        run: make CROSS=m68k-linux-gnu- qualify-m2_5

      - name: Qualify M2.6 ordered reset-overlay hand-off
        run: make CROSS=m68k-linux-gnu- qualify-m2_6

      - name: Qualify M2.7 framebuffer diagnostic
        run: make CROSS=m68k-linux-gnu- qualify-m2_7

      - name: Qualify M2.8 VIA Timer 1 interrupt path
        run: make CROSS=m68k-linux-gnu- qualify-m2_8

      - name: Qualify M2.9 keyboard VIA shift-register path
        run: make CROSS=m68k-linux-gnu- qualify-m2_9

      - name: Qualify M2.10 IWM media-sense path
        run: make CROSS=m68k-linux-gnu- qualify-m2_10

      - name: Qualify M2.11 raw IWM floppy read path
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m2_11.sh

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-runtime-evidence
          path: |
            build/librom-m1.bin
            build/librom-m1.map
            build/m1-runtime/runtime.txt
            build/librom-m2.3-macplus.bin
            build/librom-m2.3-macplus.map
            build/m2_3-runtime/runtime.txt
            build/librom-m2.4-macplus.bin
            build/librom-m2.4-macplus.map
            build/m2_4-runtime/runtime.txt
            build/m2_5-pce/libre-rom-mac-plus.cfg
            build/m2_5-pce/runtime.txt
            build/librom-m2.6-macplus.bin
            build/librom-m2.6-macplus.map
            build/m2_6-runtime/runtime.txt
            build/m2_6-pce/libre-rom-mac-plus.cfg
            build/m2_6-pce/runtime.txt
            build/librom-m2.7-macplus.bin
            build/librom-m2.7-macplus.map
            build/m2_7-runtime/runtime.txt
            build/m2_7-pce/libre-rom-mac-plus.cfg
            build/m2_7-pce/runtime.txt
            build/librom-m2.8-macplus.bin
            build/librom-m2.8-macplus.map
            build/m2_8-runtime/runtime.txt
            build/m2_8-pce/libre-rom-mac-plus.cfg
            build/m2_8-pce/runtime.txt
            build/librom-m2.9-macplus.bin
            build/librom-m2.9-macplus.map
            build/m2_9-runtime/runtime.txt
            build/m2_9-pce/libre-rom-mac-plus.cfg
            build/m2_9-pce/runtime.txt
            build/librom-m2.10-macplus.bin
            build/librom-m2.10-macplus.map
            build/m2_10-pce/libre-rom-iwm-empty.cfg
            build/m2_10-pce/libre-rom-iwm-media.cfg
            build/m2_10-pce/empty-runtime.txt
            build/m2_10-pce/media-runtime.txt
            build/m2_10-pce/runtime.txt
            build/m2_10-pce/test-disk.psi
            build/librom-m2.11-macplus.bin
            build/librom-m2.11-macplus.map
            build/m2_11-pce/libre-rom-iwm-read.cfg
            build/m2_11-pce/runtime-transcript.txt
            build/m2_11-pce/runtime.txt
            build/m2_11-pce/test-disk.psi
          if-no-files-found: warn
