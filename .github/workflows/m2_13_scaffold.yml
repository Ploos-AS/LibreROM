name: Scaffold M2.13 boot transfer

on:
  push:
    paths:
      - '.github/workflows/m2_13_scaffold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create M2.13
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          copies = {
              'src/platform/macplus/reset_m2_12.S': 'src/platform/macplus/reset_m2_13.S',
              'linker/m2_12.ld': 'linker/m2_13.ld',
              'scripts/check_m2_12.py': 'scripts/check_m2_13.py',
              'scripts/qualify_m2_12.sh': 'scripts/qualify_m2_13.sh',
              'scripts/qualify_m2_12_pce.sh': 'scripts/qualify_m2_13_pce.sh',
              'docs/M2_12_GCR_SECTOR_QUALIFICATION.md': 'docs/M2_13_BOOT_TRANSFER_QUALIFICATION.md',
          }
          for src, dst in copies.items():
              shutil.copyfile(src, dst)
              p = Path(dst)
              s = p.read_text()
              s = s.replace('m2_12', 'm2_13').replace('M2_12', 'M2_13')
              s = s.replace('M2.12', 'M2.13').replace('m2.12', 'm2.13')
              p.write_text(s)

          # Firmware: change fixture identity and transfer control after successful
          # sector decode/checksum/copy. The inherited M2.12 SEC2/CHK2 markers remain
          # cumulative evidence; XFR3 and BT13 are the new M2.13 proof chain.
          p = Path('src/platform/macplus/reset_m2_13.S')
          s = p.read_text()
          s = s.replace('cmpi.l  #0x4c523132,(%a0)       /* fixture begins LR12 */',
                        'cmpi.l  #0x4c523133,(%a0)       /* fixture begins LR13 */')
          old = '''        move.l  #0x00000440,%a0
        move.l  #0x53454332,(%a0)       /* SEC2 */
        move.l  #0x00000444,%a0
        move.l  #0x43484b32,(%a0)       /* CHK2 */
        bra.s   _m2_13_read_done
'''
          new = '''        move.l  #0x00000440,%a0
        move.l  #0x53454332,(%a0)       /* SEC2 */
        move.l  #0x00000444,%a0
        move.l  #0x43484b32,(%a0)       /* CHK2 */
        bra.w   _m2_13_transfer
'''
          if old not in s:
              raise SystemExit('M2.13 success block not found')
          s = s.replace(old, new, 1)
          marker = '''_m2_13_checksum_fail:
'''
          transfer = '''/* M2.13: validate project-owned boot header and transfer control to RAM. */
_m2_13_transfer:
        move.l  #0x0000042c,%a0
        move.l  #0x49574d32,(%a0)       /* IWM2 */

        /* Stop the drive and restore VIA state before handing control away. */
        move.b  0x00c01001,%d0         /* ENABLE low */
        move.b  0x00c00001,%d0
        move.b  0x00c00601,%d0
        move.b  0x00c00a01,%d0         /* CA2 high: motor off */
        move.b  0x00c00e01,%d0
        move.b  0x00c00c01,%d0
        move.l  #0x00efe600,%a0
        move.b  %d6,(%a0)

        /* Header: LR13 followed by an absolute project-owned entry address. */
        move.l  #0x00002000,%a0
        move.l  4(%a0),%d0
        cmpi.l  #0x00002010,%d0
        bne.w   _m2_13_payload_fail
        move.l  %d0,%a1

        move.l  #0x00000448,%a0
        move.l  #0x58465233,(%a0)       /* XFR3: transfer validated */
        jmp     (%a1)

'''
          if marker not in s:
              raise SystemExit('M2.13 checksum label not found')
          s = s.replace(marker, transfer + marker, 1)
          p.write_text(s)

          # Static invariants: retain all M2.12 loader checks and add entry/transfer proof.
          p = Path('scripts/check_m2_13.py')
          s = p.read_text()
          s = s.replace('"fixture-marker": "0x4c523132",',
                        '"fixture-marker": "0x4c523133",\n    "boot-entry": "0x00002010",\n    "transfer-marker": "XFR3",')
          s = s.replace('"qualification-fixture": "sector0.bin",',
                        '"qualification-fixture": "sector0.bin",\n    "qualification-proof": "BT13",')
          s = s.replace('PASS: LibreROM M2.13 GCR sector-loader invariants',
                        'PASS: LibreROM M2.13 GCR boot-transfer invariants')
          p.write_text(s)

          # Qualification fixture: 512-byte project-owned sector with LR13 header,
          # fixed RAM entry, and tiny 68000 code that writes BT13 then STOPs.
          p = Path('scripts/qualify_m2_13_pce.sh')
          s = p.read_text()
          start = s.index("# Project-owned sector 0 payload.")
          end = s.index("# Create a clean 400 KiB Macintosh sector image", start)
          payload = '''# Project-owned sector 0 payload. Header layout:\n#   +0  \"LR13\"\n#   +4  big-endian absolute entry address 0x00002010\n#   +8  \"BOOT13\\0\\0\"\n#   +16 68000 code: write BT13 at 0x448, then STOP #0x2700.\npython3 - "$PAYLOAD" <<'PYFIX'\nfrom pathlib import Path\nimport struct, sys\np = Path(sys.argv[1])\nbuf = bytearray(512)\nbuf[0:4] = b"LR13"\nbuf[4:8] = struct.pack(">I", 0x00002010)\nbuf[8:16] = b"BOOT13\\0\\0"\ncode = bytes.fromhex(\n    "20 7c 00 00 04 48 "  # movea.l #0x448,a0\n    "20 bc 42 54 31 33 "  # move.l  #BT13,(a0)\n    "4e 72 27 00"          # stop #0x2700\n)\nbuf[16:16+len(code)] = code\nfor i in range(16 + len(code), 512):\n    buf[i] = (i * 37 + 0x13) & 0xff\np.write_bytes(buf)\nPYFIX\n[ "$(stat -c %s "$PAYLOAD")" -eq 512 ] || exit 1\n\n'''
          s = s[:start] + payload + s[end:]
          s = s.replace("    printf 'g b %X\\n' \"$STOP_ADDR\"", "    printf 'g b 201C\\n'")
          s = s.replace("grep -Eq '00002000.*4C 52 31 32 42 4F 4F 54' \"$TRANSCRIPT\"",
                        "grep -Eq '00002000.*4C 52 31 33 00 00 20 10' \"$TRANSCRIPT\"\ngrep -Eq '00000440.*58 46 52 33.*42 54 31 33' \"$TRANSCRIPT\"")
          s = s.replace("    printf 'stop_address=0x%X\\n' \"$STOP_ADDR\"", "    echo \"payload_entry=0x00002010\"\n    echo \"payload_stop=0x0000201C\"")
          s = s.replace('echo "payload_marker=LR12BOOT"', 'echo "payload_marker=LR13"\n    echo "transfer_marker=XFR3"\n    echo "payload_proof=BT13"')
          s = s.replace('echo "LibreROM M2.13 PCE qualification: PASS"', 'echo "LibreROM M2.13 PCE boot-transfer qualification: PASS"')
          p.write_text(s)

          # Documentation: make the new milestone semantics explicit.
          p = Path('docs/M2_13_BOOT_TRANSFER_QUALIFICATION.md')
          s = p.read_text()
          s += '''\n\n## M2.13 control-transfer delta\n\nM2.13 extends the qualified M2.12 sector loader with a deliberately minimal,\nproject-owned boot contract. Sector 0 begins with `LR13`, a big-endian absolute\nentry address `0x00002010`, and project-owned 68000 code. After GCR decode,\nchecksum validation and the 512-byte copy to `0x00002000`, firmware validates\nthe entry address, shuts down the IWM motor path, restores VIA DDRA, writes\n`XFR3`, and jumps to RAM. The fixture code writes `BT13` at `0x00000448` and\nexecutes `STOP #0x2700`. PCE qualification breaks at `0x0000201c` and requires\nboth `XFR3` and `BT13`, proving that control actually crossed from ROM into the\nloaded sector. No Apple ROM, System software, boot block, or derived binary is\nused.\n'''
          p.write_text(s)

          # Makefile: close M2.11/M2.12 debt and add M2.13 as first-class targets.
          p = Path('Makefile')
          s = p.read_text()
          vars_anchor = '''M2_10_MAP := $(BUILD)/librom-m2.10-macplus.map\n'''
          vars_add = vars_anchor + '''\nM2_11_OBJ := $(BUILD)/m2_11-reset.o\nM2_11_ELF := $(BUILD)/librom-m2.11-macplus.elf\nM2_11_ROM := $(BUILD)/librom-m2.11-macplus.bin\nM2_11_MAP := $(BUILD)/librom-m2.11-macplus.map\n\nM2_12_OBJ := $(BUILD)/m2_12-reset.o\nM2_12_ELF := $(BUILD)/librom-m2.12-macplus.elf\nM2_12_ROM := $(BUILD)/librom-m2.12-macplus.bin\nM2_12_MAP := $(BUILD)/librom-m2.12-macplus.map\n\nM2_13_OBJ := $(BUILD)/m2_13-reset.o\nM2_13_ELF := $(BUILD)/librom-m2.13-macplus.elf\nM2_13_ROM := $(BUILD)/librom-m2.13-macplus.bin\nM2_13_MAP := $(BUILD)/librom-m2.13-macplus.map\n'''
          if vars_anchor not in s: raise SystemExit('Makefile vars anchor missing')
          s = s.replace(vars_anchor, vars_add, 1)
          s = s.replace('check-m2_10 qualify-m1', 'check-m2_10 check-m2_11 check-m2_12 check-m2_13 qualify-m1')
          s = s.replace('qualify-m2_9 qualify-m2_10 clean', 'qualify-m2_9 qualify-m2_10 qualify-m2_11 qualify-m2_12 qualify-m2_13 clean')
          rule_anchor = '''$(M2_10_ROM): $(M2_10_ELF)\n\t$(OBJCOPY) -O binary --gap-fill=0xff $< $@\n\t$(PYTHON) scripts/pad_rom.py $@ 131072\n'''
          rule_add = rule_anchor + '''\n$(M2_11_OBJ): src/platform/macplus/reset_m2_11.S | $(BUILD)\n\t$(AS) -m68000 -o $@ $<\n\n$(M2_11_ELF): $(M2_11_OBJ) linker/m2_11.ld\n\t$(LD) -T linker/m2_11.ld -Map=$(M2_11_MAP) -o $@ $(M2_11_OBJ)\n\n$(M2_11_ROM): $(M2_11_ELF)\n\t$(OBJCOPY) -O binary --gap-fill=0xff $< $@\n\t$(PYTHON) scripts/pad_rom.py $@ 131072\n\n$(M2_12_OBJ): src/platform/macplus/reset_m2_12.S | $(BUILD)\n\t$(AS) -m68000 -o $@ $<\n\n$(M2_12_ELF): $(M2_12_OBJ) linker/m2_12.ld\n\t$(LD) -T linker/m2_12.ld -Map=$(M2_12_MAP) -o $@ $(M2_12_OBJ)\n\n$(M2_12_ROM): $(M2_12_ELF)\n\t$(OBJCOPY) -O binary --gap-fill=0xff $< $@\n\t$(PYTHON) scripts/pad_rom.py $@ 131072\n\n$(M2_13_OBJ): src/platform/macplus/reset_m2_13.S | $(BUILD)\n\t$(AS) -m68000 -o $@ $<\n\n$(M2_13_ELF): $(M2_13_OBJ) linker/m2_13.ld\n\t$(LD) -T linker/m2_13.ld -Map=$(M2_13_MAP) -o $@ $(M2_13_OBJ)\n\n$(M2_13_ROM): $(M2_13_ELF)\n\t$(OBJCOPY) -O binary --gap-fill=0xff $< $@\n\t$(PYTHON) scripts/pad_rom.py $@ 131072\n'''
          if rule_anchor not in s: raise SystemExit('Makefile rule anchor missing')
          s = s.replace(rule_anchor, rule_add, 1)
          s = s.replace('\t$(PYTHON) scripts/check_m2_10.py\n\ncheck-m2:', '\t$(PYTHON) scripts/check_m2_10.py\n\t$(PYTHON) scripts/check_m2_11.py\n\t$(PYTHON) scripts/check_m2_12.py\n\t$(PYTHON) scripts/check_m2_13.py\n\ncheck-m2:', 1)
          s = s.replace('check-m2_10:\n\t$(PYTHON) scripts/check_m2_10.py\n', 'check-m2_10:\n\t$(PYTHON) scripts/check_m2_10.py\n\ncheck-m2_11:\n\t$(PYTHON) scripts/check_m2_11.py\n\ncheck-m2_12:\n\t$(PYTHON) scripts/check_m2_12.py\n\ncheck-m2_13:\n\t$(PYTHON) scripts/check_m2_13.py\n', 1)
          q_anchor = '''qualify-m2_10: $(M2_10_ROM) $(M2_10_ELF)\n\t$(PYTHON) scripts/check_m2_10.py\n\tCROSS=$(CROSS) bash scripts/qualify_m2_10_pce.sh $(M2_10_ROM) $(M2_10_ELF)\n'''
          q_add = q_anchor + '''\nqualify-m2_11: $(M2_11_ROM) $(M2_11_ELF)\n\t$(PYTHON) scripts/check_m2_11.py\n\tCROSS=$(CROSS) bash scripts/qualify_m2_11_pce.sh $(M2_11_ROM) $(M2_11_ELF)\n\nqualify-m2_12: $(M2_12_ROM) $(M2_12_ELF)\n\t$(PYTHON) scripts/check_m2_12.py\n\tCROSS=$(CROSS) bash scripts/qualify_m2_12_pce.sh $(M2_12_ROM) $(M2_12_ELF)\n\nqualify-m2_13: $(M2_13_ROM) $(M2_13_ELF)\n\t$(PYTHON) scripts/check_m2_13.py\n\tCROSS=$(CROSS) bash scripts/qualify_m2_13_pce.sh $(M2_13_ROM) $(M2_13_ELF)\n'''
          if q_anchor not in s: raise SystemExit('Makefile qualify anchor missing')
          s = s.replace(q_anchor, q_add, 1)
          p.write_text(s)

          # CI: use Makefile for 11/12, add M2.13 and evidence.
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace('run: CROSS=m68k-linux-gnu- bash scripts/qualify_m2_11.sh', 'run: make CROSS=m68k-linux-gnu- qualify-m2_11')
          s = s.replace('run: CROSS=m68k-linux-gnu- bash scripts/qualify_m2_12.sh', 'run: make CROSS=m68k-linux-gnu- qualify-m2_12')
          needle = '''      - name: Qualify M2.12 GCR sector-0 loader\n        run: make CROSS=m68k-linux-gnu- qualify-m2_12\n'''
          add = needle + '''\n      - name: Qualify M2.13 loaded boot control transfer\n        run: make CROSS=m68k-linux-gnu- qualify-m2_13\n'''
          if needle not in s: raise SystemExit('CI M2.12 anchor missing')
          s = s.replace(needle, add, 1)
          artifact_anchor = '''            build/m2_12-pce/sector0.bin\n'''
          artifact_add = artifact_anchor + '''            build/librom-m2.13-macplus.bin\n            build/librom-m2.13-macplus.map\n            build/m2_13-pce/libre-rom-sector-loader.cfg\n            build/m2_13-pce/runtime-transcript.txt\n            build/m2_13-pce/runtime.txt\n            build/m2_13-pce/test-disk.psi\n            build/m2_13-pce/sector0.bin\n'''
          if artifact_anchor not in s: raise SystemExit('CI artifact anchor missing')
          s = s.replace(artifact_anchor, artifact_add, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/macplus/reset_m2_13.S linker/m2_13.ld scripts/check_m2_13.py scripts/qualify_m2_13.sh scripts/qualify_m2_13_pce.sh docs/M2_13_BOOT_TRANSFER_QUALIFICATION.md Makefile .github/workflows/ci.yml
          git commit -m "M2.13: add loaded boot control transfer"
          git push origin HEAD:main
