name: M3.23 Interior free coalescing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu build-essential git python3 autoconf
      - name: Build and statically qualify initial M3.23
        run: CROSS=m68k-linux-gnu- bash scripts/qualify_m3_23.sh
      - name: Upload M3.23 build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerom-m3.23-build-evidence
          path: |
            build/librom-m3.23-macplus.bin
            build/librom-m3.23-macplus.map
            build/m3_23-runtime/runtime.txt
          if-no-files-found: warn
