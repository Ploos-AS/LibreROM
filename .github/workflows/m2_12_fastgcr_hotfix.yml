name: M2.12 fast GCR hotfix

on:
  push:
    paths:
      - '.github/workflows/m2_12_fastgcr_hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch M2.12 GCR decoder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/platform/macplus/reset_m2_12.S')
          s = p.read_text()
          old = '''/* Translate one GCR byte through the 64-entry clean-room table. */
_m2_12_get_gcr_symbol:
        bsr.s   _m2_12_get_iwm_byte
        tst.l   %d0
        bmi.s   8f
        lea     _m2_12_gcr_table(%pc),%a3
        moveq   #0,%d2
6:
        cmp.b   (%a3)+,%d0
        beq.s   7f
        addq.l  #1,%d2
        cmpi.l  #64,%d2
        bne.s   6b
        moveq   #-1,%d0
        rts
7:
        move.l  %d2,%d0
8:
        rts
'''
          new = '''/* Translate one GCR byte with a constant-time 128-entry decode table.
 * All legal Macintosh GCR symbols have bit 7 set, so index by low 7 bits.
 * This is timing-critical: PCE models the IWM as a one-byte read buffer and
 * will overwrite unread data when the 68000 decoder spends too long scanning.
 */
_m2_12_get_gcr_symbol:
        bsr.s   _m2_12_get_iwm_byte
        tst.l   %d0
        bmi.s   8f
        andi.l  #0x0000007f,%d0
        lea     _m2_12_gcr_decode_table(%pc),%a3
        move.b  0(%a3,%d0.w),%d0
        cmpi.b  #0xff,%d0
        bne.s   8f
        moveq   #-1,%d0
8:
        rts
'''
          if old not in s:
              raise SystemExit('old GCR decoder block not found')
          s = s.replace(old, new, 1)
          needle = '''_m2_12_gcr_table:
        .byte 0x96,0x97,0x9a,0x9b,0x9d,0x9e,0x9f,0xa6
        .byte 0xa7,0xab,0xac,0xad,0xae,0xaf,0xb2,0xb3
        .byte 0xb4,0xb5,0xb6,0xb7,0xb9,0xba,0xbb,0xbc
        .byte 0xbd,0xbe,0xbf,0xcb,0xcd,0xce,0xcf,0xd3
        .byte 0xd6,0xd7,0xd9,0xda,0xdb,0xdc,0xdd,0xde
        .byte 0xdf,0xe5,0xe6,0xe7,0xe9,0xea,0xeb,0xec
        .byte 0xed,0xee,0xef,0xf2,0xf3,0xf4,0xf5,0xf6
        .byte 0xf7,0xf9,0xfa,0xfb,0xfc,0xfd,0xfe,0xff
'''
          table = needle + '''
/* Low-7-bit GCR decode table; 0xff denotes an invalid symbol. */
_m2_12_gcr_decode_table:
        .byte 0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff
        .byte 0xff,0xff,0xff,0xff,0xff,0xff,0x00,0x01,0xff,0xff,0x02,0x03,0xff,0x04,0x05,0x06
        .byte 0xff,0xff,0xff,0xff,0xff,0xff,0x07,0x08,0xff,0xff,0xff,0x09,0x0a,0x0b,0x0c,0x0d
        .byte 0xff,0xff,0x0e,0x0f,0x10,0x11,0x12,0x13,0xff,0x14,0x15,0x16,0x17,0x18,0x19,0x1a
        .byte 0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0x1b,0xff,0x1c,0x1d,0x1e
        .byte 0xff,0xff,0xff,0x1f,0xff,0xff,0x20,0x21,0xff,0x22,0x23,0x24,0x25,0x26,0x27,0x28
        .byte 0xff,0xff,0xff,0xff,0xff,0x29,0x2a,0x2b,0xff,0x2c,0x2d,0x2e,0x2f,0x30,0x31,0x32
        .byte 0xff,0xff,0x33,0x34,0x35,0x36,0x37,0x38,0xff,0x39,0x3a,0x3b,0x3c,0x3d,0x3e,0x3f
'''
          if needle not in s:
              raise SystemExit('GCR table block not found')
          s = s.replace(needle, table, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/macplus/reset_m2_12.S
          git commit -m "M2.12: use timing-safe GCR decode lookup"
          git push origin HEAD:main
